<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Soppa</title>
    <script>
      // Aseta teema ennen renderöintiä (estää vaalean välähdyksen).
      // Oletus: tallennettu valinta, muuten järjestelmän asetus.
      // theme-color seuraa yläpalkin pintaa (index.css --c-surface / --c-bg).
      (function () {
        try {
          var saved = localStorage.getItem('catering_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0f14');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
